<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EliteGrowth Hub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #f7f7f5; color: #1a1a1a; display: flex; height: 100vh; overflow: hidden; font-size: 14px; }
        .sidebar { width: 220px; background: #0f0f0f; color: #eaeaea; padding: 20px 0; flex-shrink: 0; }
        .brand { padding: 0 20px 20px; font-weight: 700; font-size: 18px; color: #d4a017; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .brand small { display: block; font-size: 10px; color: #aaa; }
        .nav-item { padding: 10px 20px; cursor: pointer; color: #bbb; }
        .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.05); color: #d4a017; }
        .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .topbar { display: flex; justify-content: space-between; padding: 12px 24px; background: #fff; border-bottom: 1px solid #e2e2e2; }
        .topbar h1 { font-size: 18px; }
        .content { flex: 1; overflow-y: auto; padding: 24px; }
        .card { background: #fff; border-radius: 10px; border: 1px solid #e2e2e2; padding: 18px; margin-bottom: 18px; }
        .btn { padding: 8px 14px; border-radius: 6px; border: 1px solid #e2e2e2; background: #fff; cursor: pointer; font-size: 13px; }
        .btn.gold { background: #d4a017; color: #000; border-color: #d4a017; }
        .btn.primary { background: #000; color: #fff; }
        .btn.danger { background: #b42318; color: #fff; border-color: #b42318; }
        .btn.small { padding: 5px 10px; font-size: 12px; }
        .flex { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .mt-10 { margin-top: 10px; }
        .mb-10 { margin-bottom: 10px; }
        .hidden { display: none !important; }
        input, select, textarea { padding: 8px 10px; border: 1px solid #e2e2e2; border-radius: 6px; background: #fff; width: 100%; font-size: 14px; }
        label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: #555; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
        .form-row.single { grid-template-columns: 1fr; }
        .badge { display: inline-block; padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; background: #f0f0f0; color: #555; }
        .badge.high { background: #fdeaea; color: #b42318; }
        .badge.medium { background: #fff7e6; color: #b54708; }
        .badge.low { background: #e6f7e6; color: #067647; }
        .table-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #e2e2e2; }
        th { background: #fafafa; font-weight: 600; color: #555; font-size: 11px; text-transform: uppercase; }
        tr:hover td { background: #fcfcf9; }
        .empty-state { text-align: center; padding: 40px; color: #999; }
        .score-bar { display: inline-block; width: 60px; height: 6px; background: #eee; border-radius: 3px; overflow: hidden; vertical-align: middle; }
        .score-bar span { display: block; height: 100%; background: #d4a017; }
        .toast-container { position: fixed; top: 70px; right: 20px; z-index: 2000; display: flex; flex-direction: column; gap: 10px; }
        .toast { padding: 12px 18px; background: #111; color: #fff; border-radius: 6px; font-size: 13px; max-width: 350px; }
        .toast.success { background: #067647; }
        .toast.error { background: #b42318; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .modal { background: #fff; border-radius: 12px; max-width: 900px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 24px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .modal-header h2 { font-size: 18px; }
        .close-btn { font-size: 24px; cursor: pointer; color: #888; }
        .upload-area { border: 2px dashed #e2e2e2; border-radius: 8px; padding: 20px; text-align: center; cursor: pointer; }
        .upload-area:hover { border-color: #d4a017; background: #fdf6e3; }
        .preview-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
        .preview-item { position: relative; width: 100px; height: 100px; border-radius: 6px; overflow: hidden; border: 1px solid #e2e2e2; }
        .preview-item img { width: 100%; height: 100%; object-fit: cover; }
        .preview-item .remove { position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,0.7); color: #fff; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; line-height: 20px; text-align: center; cursor: pointer; }
        .activity-item { padding: 8px 0; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
        .activity-item .timestamp { color: #999; font-size: 11px; margin-right: 6px; }
        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .metric-card { background: #fff; border-radius: 10px; border: 1px solid #e2e2e2; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .metric-card .value { font-size: 28px; font-weight: 700; color: #d4a017; }
        .metric-card .label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: #555; }
        @media (max-width: 768px) { .sidebar { width: 60px; } .brand small { display: none; } .nav-item span { display: none; } .form-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<div id="app">
    <aside class="sidebar">
        <div class="brand">EliteGrowth Hub<small>LinkedIn Prospect Intelligence CRM</small></div>
        <nav id="mainNav">
            <div class="nav-item active" data-view="dashboard">📊 Dashboard</div>
            <div class="nav-item" data-view="prospects">👤 Prospects</div>
            <div class="nav-item" data-view="settings">⚙️ Settings</div>
        </nav>
    </aside>
    <div class="main">
        <header class="topbar">
            <h1 id="viewTitle">Dashboard</h1>
            <span id="apiStatusBadge" class="api-status" style="padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;background:#eee;color:#555;">API: Not Configured</span>
        </header>
        <main class="content" id="content"></main>
    </div>
</div>
<div class="toast-container" id="toastContainer"></div>
<div id="modalContainer"></div>

<script>
// ==================== APP STATE ====================
let appState = {
    prospects: [],
    companies: [],
    activities: [],
    settings: { apiKey: '' },
    apiUsage: { requests: 0, successful: 0, failed: 0 }
};

// ==================== LOAD/SAVE ====================
function loadState() {
    try {
        const raw = localStorage.getItem('elitegrowthhub_state');
        if (raw) {
            const parsed = JSON.parse(raw);
            appState.prospects = parsed.prospects || [];
            appState.companies = parsed.companies || [];
            appState.activities = parsed.activities || [];
            appState.settings = parsed.settings || { apiKey: '' };
            appState.apiUsage = parsed.apiUsage || { requests: 0, successful: 0, failed: 0 };
        }
    } catch(e) {}
}

function saveState() {
    try {
        localStorage.setItem('elitegrowthhub_state', JSON.stringify(appState));
    } catch(e) {}
}

loadState();

// ==================== UTILITIES ====================
function createId() { return Date.now().toString(36) + '_' + Math.random().toString(36).substring(2, 8); }
function todayISO() { return new Date().toISOString(); }
function formatDate(iso) { if (!iso) return '—'; return new Date(iso).toLocaleDateString(); }
function escapeHtml(str) { if (!str) return ''; return String(str).replace(/[&<>"']/g, function(m) { const map = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}; return map[m]; }); }
function toast(msg, type = 'info') { const el = document.createElement('div'); el.className = `toast ${type}`; el.textContent = msg; document.getElementById('toastContainer').appendChild(el); setTimeout(() => el.remove(), 3000); }

function updateApiStatus() {
    const badge = document.getElementById('apiStatusBadge');
    if (!badge) return;
    if (!appState.settings.apiKey) { badge.textContent = 'API: Not Configured'; badge.style.background = '#eee'; badge.style.color = '#555'; return; }
    if (appState.apiUsage.successful > 0) { badge.textContent = 'API: Connected'; badge.style.background = '#e6f7e6'; badge.style.color = '#067647'; return; }
    badge.textContent = 'API: Configured'; badge.style.background = '#fff7e6'; badge.style.color = '#b54708';
}

function openModal(html) { document.getElementById('modalContainer').innerHTML = `<div class="modal-overlay" onclick="if(event.target===this) closeModal()"><div class="modal">${html}</div></div>`; }
function closeModal() { document.getElementById('modalContainer').innerHTML = ''; }

// ==================== NAVIGATION ====================
document.getElementById('mainNav').addEventListener('click', (e) => {
    const item = e.target.closest('.nav-item');
    if (!item) return;
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    item.classList.add('active');
    document.getElementById('viewTitle').textContent = item.textContent.trim();
    renderView(item.dataset.view);
});

function renderView(view) {
    const content = document.getElementById('content');
    if (!content) return;
    if (view === 'dashboard') renderDashboard(content);
    else if (view === 'prospects') renderProspects(content);
    else if (view === 'settings') renderSettings(content);
    else renderDashboard(content);
}

// ==================== DASHBOARD ====================
function renderDashboard(container) {
    const p = appState.prospects;
    const total = p.length;
    const newCount = p.filter(x => x.stage === 'NEW').length;
    const highPriority = p.filter(x => x.priority === 'HIGH').length;
    const qualified = p.filter(x => x.stage === 'QUALIFIED' || x.icpScore >= 70).length;
    const messagesReady = p.filter(x => x.initialMessage).length;
    const won = p.filter(x => x.stage === 'WON').length;

    container.innerHTML = `
        <div class="metrics-grid">
            <div class="metric-card"><div class="value">${total}</div><div class="label">Total Prospects</div></div>
            <div class="metric-card"><div class="value">${newCount}</div><div class="label">New</div></div>
            <div class="metric-card"><div class="value">${highPriority}</div><div class="label">High Priority</div></div>
            <div class="metric-card"><div class="value">${qualified}</div><div class="label">Qualified</div></div>
            <div class="metric-card"><div class="value">${messagesReady}</div><div class="label">Messages Ready</div></div>
            <div class="metric-card"><div class="value">${won}</div><div class="label">Won</div></div>
        </div>
        <div class="card">
            <h3>Recent Activity</h3>
            ${appState.activities.length ? appState.activities.slice(-5).reverse().map(a => `<div class="activity-item"><span class="timestamp">${formatDate(a.createdAt)}</span> ${escapeHtml(a.text)}</div>`).join('') : '<div class="empty-state">No activity yet. Add a prospect to get started!</div>'}
        </div>
        <div class="card">
            <h3>Quick Actions</h3>
            <div class="flex">
                <button class="btn gold" onclick="openAddProspectModal()">+ Add Prospect</button>
                <button class="btn" onclick="renderView('prospects')">View All Prospects</button>
            </div>
        </div>
    `;
}

// ==================== PROSPECTS ====================
function renderProspects(container) {
    const p = appState.prospects;
    container.innerHTML = `
        <div class="flex-between mb-10">
            <h3>Prospects (${p.length})</h3>
            <button class="btn gold" onclick="openAddProspectModal()">+ Add Prospect</button>
        </div>
        <div class="card">
            <div class="table-wrap">
                <table>
                    <thead><tr><th>Name</th><th>Company</th><th>Role</th><th>ICP</th><th>Priority</th><th>Stage</th><th>Actions</th></tr></thead>
                    <tbody>
                        ${p.length ? p.map(pro => `
                            <tr>
                                <td>${escapeHtml(pro.fullName || pro.firstName || '—')}</td>
                                <td>${escapeHtml(pro.companyName || '—')}</td>
                                <td>${escapeHtml(pro.jobTitle || '—')}</td>
                                <td><span class="score-bar"><span style="width:${pro.icpScore||0}%"></span></span> ${pro.icpScore||0}</td>
                                <td><span class="badge ${pro.priority === 'HIGH' ? 'high' : pro.priority === 'MEDIUM' ? 'medium' : 'low'}">${escapeHtml(pro.priority||'LOW')}</span></td>
                                <td>${escapeHtml(pro.stage||'NEW')}</td>
                                <td class="flex" style="gap:4px;">
                                    <button class="btn small" onclick="viewProspect('${pro.id}')">View</button>
                                    <button class="btn small danger" onclick="deleteProspect('${pro.id}')">Delete</button>
                                </td>
                            </tr>
                        `).join('') : '<tr><td colspan="7" class="empty-state">No prospects yet. Click "Add Prospect" to get started!</td></tr>'}
                    </tbody>
                </table>
            </div>
        </div>
    `;
}

// ==================== ADD PROSPECT ====================
let addProspectScreenshots = [];

function openAddProspectModal() {
    addProspectScreenshots = [];
    openModal(`
        <div class="modal-header">
            <h2>Add LinkedIn Prospect</h2>
            <button class="close-btn" onclick="closeModal()">×</button>
        </div>
        <form onsubmit="event.preventDefault();">
            <div class="form-row">
                <div>
                    <label>First Name *</label>
                    <input type="text" id="pFirstName" placeholder="Enter first name" required>
                </div>
                <div>
                    <label>Last Name</label>
                    <input type="text" id="pLastName" placeholder="Enter last name">
                </div>
            </div>
            <div class="form-row">
                <div>
                    <label>Company Name</label>
                    <input type="text" id="pCompanyName" placeholder="Enter company name">
                </div>
                <div>
                    <label>Job Title</label>
                    <input type="text" id="pJobTitle" placeholder="Enter job title">
                </div>
            </div>
            <div class="form-row">
                <div>
                    <label>LinkedIn URL</label>
                    <input type="url" id="pLinkedinUrl" placeholder="https://www.linkedin.com/in/...">
                </div>
                <div>
                    <label>Email</label>
                    <input type="email" id="pEmail" placeholder="email@example.com">
                </div>
            </div>
            <div class="form-row single">
                <label>Upload LinkedIn Screenshots (Optional)</label>
                <div class="upload-area" id="screenshotUploadArea" onclick="document.getElementById('screenshotInput').click()">
                    📤 Drag & Drop or Browse — PNG, JPG, WEBP
                </div>
                <input type="file" id="screenshotInput" accept=".png,.jpg,.jpeg,.webp" multiple class="hidden" onchange="handleScreenshotFiles(this.files)">
                <div class="preview-grid" id="screenshotPreviews"></div>
            </div>
            <div class="flex mt-10">
                <button type="button" class="btn primary" onclick="saveProspect()">💾 Save Prospect</button>
                <button type="button" class="btn" onclick="closeModal()">Cancel</button>
            </div>
        </form>
    `);
    setupScreenshotDropzone();
}

function setupScreenshotDropzone() {
    const area = document.getElementById('screenshotUploadArea');
    if (!area) return;
    area.addEventListener('dragover', (e) => { e.preventDefault(); area.classList.add('dragover'); });
    area.addEventListener('dragleave', () => area.classList.remove('dragover'));
    area.addEventListener('drop', (e) => { e.preventDefault(); area.classList.remove('dragover'); handleScreenshotFiles(e.dataTransfer.files); });
}

async function handleScreenshotFiles(files) {
    for (const file of files) {
        if (!['image/png','image/jpeg','image/jpg','image/webp'].includes(file.type)) { toast('Invalid file type', 'error'); continue; }
        try {
            const reader = new FileReader();
            const dataUrl = await new Promise((resolve, reject) => { reader.onload = () => resolve(reader.result); reader.onerror = reject; reader.readAsDataURL(file); });
            addProspectScreenshots.push({ id: createId(), dataUrl, name: file.name });
        } catch(e) { toast('Image failed', 'error'); }
    }
    renderScreenshotPreviews();
}

function renderScreenshotPreviews() {
    const container = document.getElementById('screenshotPreviews');
    if (!container) return;
    container.innerHTML = addProspectScreenshots.map((s, i) => `
        <div class="preview-item"><img src="${s.dataUrl}" alt="screenshot"><span class="remove" onclick="removeScreenshot('${s.id}')">×</span></div>
    `).join('');
}
function removeScreenshot(id) {
    addProspectScreenshots = addProspectScreenshots.filter(s => s.id !== id);
    renderScreenshotPreviews();
}

function saveProspect() {
    const firstName = document.getElementById('pFirstName')?.value.trim();
    const lastName = document.getElementById('pLastName')?.value.trim() || '';
    const companyName = document.getElementById('pCompanyName')?.value.trim() || '';
    
    if (!firstName && !companyName) {
        toast('Please provide at least name or company', 'error');
        return;
    }

    const data = {
        id: createId(),
        firstName: firstName || '',
        lastName: lastName,
        fullName: [firstName, lastName].filter(Boolean).join(' '),
        linkedinUrl: document.getElementById('pLinkedinUrl')?.value.trim() || '',
        companyName: companyName,
        jobTitle: document.getElementById('pJobTitle')?.value.trim() || '',
        email: document.getElementById('pEmail')?.value.trim() || '',
        screenshots: addProspectScreenshots,
        stage: 'NEW',
        priority: 'LOW',
        icpScore: 0,
        decisionMakerScore: 0,
        createdAt: todayISO(),
        updatedAt: todayISO()
    };

    appState.prospects.push(data);
    appState.activities.push({ id: createId(), text: 'Prospect Created: ' + data.fullName, createdAt: todayISO() });
    saveState();
    closeModal();
    toast('Prospect saved successfully!', 'success');
    renderView('prospects');
}

function deleteProspect(id) {
    if (!confirm('Delete this prospect?')) return;
    appState.prospects = appState.prospects.filter(p => p.id !== id);
    appState.activities.push({ id: createId(), text: 'Prospect Deleted', createdAt: todayISO() });
    saveState();
    renderView('prospects');
    toast('Prospect deleted');
}

function viewProspect(id) {
    const p = appState.prospects.find(x => x.id === id);
    if (!p) { toast('Prospect not found', 'error'); return; }
    openModal(`
        <div class="modal-header">
            <h2>${escapeHtml(p.fullName || p.firstName)}</h2>
            <button class="close-btn" onclick="closeModal()">×</button>
        </div>
        <p><strong>Company:</strong> ${escapeHtml(p.companyName || '—')}</p>
        <p><strong>Role:</strong> ${escapeHtml(p.jobTitle || '—')}</p>
        <p><strong>LinkedIn:</strong> ${p.linkedinUrl ? `<a href="${escapeHtml(p.linkedinUrl)}" target="_blank">${escapeHtml(p.linkedinUrl)}</a>` : '—'}</p>
        <p><strong>Stage:</strong> ${escapeHtml(p.stage||'NEW')}</p>
        <p><strong>Priority:</strong> ${escapeHtml(p.priority||'LOW')}</p>
        <p><strong>ICP Score:</strong> ${p.icpScore||0}</p>
        <div class="flex mt-10">
            <button class="btn primary" onclick="closeModal()">Close</button>
        </div>
    `);
}

// ==================== SETTINGS ====================
function renderSettings(container) {
    container.innerHTML = `
        <div class="card">
            <h3>AI Configuration</h3>
            <div class="form-row single">
                <label>Groq API Key</label>
                <input type="password" id="settingsApiKey" value="${escapeHtml(appState.settings.apiKey)}" placeholder="gsk_...">
            </div>
            <div class="flex mt-10">
                <button class="btn primary" onclick="saveSettings()">Save Configuration</button>
                <button class="btn gold" onclick="testGroqConnection()">Test Connection</button>
                <button class="btn danger" onclick="clearApiKey()">Clear API Key</button>
            </div>
            <p class="text-sm mt-10" style="color:#999;">Security Warning: Browser-side API keys can be exposed.</p>
        </div>
        <div class="card">
            <h3>API Usage</h3>
            <p><strong>Requests:</strong> ${appState.apiUsage.requests}</p>
            <p><strong>Successful:</strong> ${appState.apiUsage.successful}</p>
            <p><strong>Failed:</strong> ${appState.apiUsage.failed}</p>
        </div>
    `;
    updateApiStatus();
}

function saveSettings() {
    appState.settings.apiKey = document.getElementById('settingsApiKey')?.value.trim() || '';
    saveState();
    updateApiStatus();
    toast('Settings saved');
}

function clearApiKey() {
    appState.settings.apiKey = '';
    saveState();
    updateApiStatus();
    document.getElementById('settingsApiKey').value = '';
    toast('API key cleared');
}

async function testGroqConnection() {
    const key = document.getElementById('settingsApiKey')?.value.trim() || appState.settings.apiKey;
    if (!key) { toast('Enter API key first', 'error'); return; }
    appState.settings.apiKey = key;
    saveState();
    const btn = event.target;
    btn.disabled = true;
    btn.textContent = 'Testing...';
    try {
        const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
            body: JSON.stringify({ model: 'openai/gpt-oss-120b', messages: [{ role: 'user', content: 'Reply with: GROQ_CONNECTED' }], max_tokens: 10 })
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        const text = data.choices?.[0]?.message?.content || '';
        if (text.includes('GROQ_CONNECTED')) {
            appState.apiUsage.successful++;
            toast('✅ Groq API connected successfully!', 'success');
        } else {
            throw new Error('Unexpected response');
        }
    } catch(e) {
        appState.apiUsage.failed++;
        toast('❌ Connection failed: ' + e.message, 'error');
    } finally {
        btn.disabled = false;
        btn.textContent = 'Test Connection';
        saveState();
        updateApiStatus();
    }
}

// ==================== INIT ====================
updateApiStatus();
renderView('dashboard');

window.addEventListener('error', function(e) { console.error('Error:', e.message); });
</script>
</body>
</html>
